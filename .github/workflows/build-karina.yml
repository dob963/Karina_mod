name: Build Karina firmware artifacts

on:
  push:
    paths:
      - '11.08fw_3.bin'
      - 'tools/**'
      - '.github/workflows/build-karina.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware variants
        run: python3 tools/build_karina.py
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: karina-firmware
          path: dist/*.bin
